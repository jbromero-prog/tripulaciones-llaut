name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk tripulaciones-llaut.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tripulaciones Llaüt 1.0.${{ github.run_number }}
          body: |
            Descarga `tripulaciones-llaut.apk` desde el móvil e instálalo encima de la versión anterior. La plantilla y los ajustes se conservan.
          files: tripulaciones-llaut.apk
          make_latest: true
