plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.removalencia.tripulaciones'
    compileSdk 34

    defaultConfig {
        applicationId "com.removalencia.tripulaciones"
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Misma clave en todas las versiones: así cada APK nuevo se instala encima del anterior sin perder datos.
    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword "crcv-llaut"
            keyAlias "crcv"
            keyPassword "crcv-llaut"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
